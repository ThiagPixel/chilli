# ============================================================================
# Chilli — stack de PRODUÇÃO.
#
# Projeto: chilli-prod
# - backend (NODE_ENV=production, DATABASE_URL=...chilli)
# - frontend (build Vite → nginx servindo dist/)
# - nginx externo (HTTPS via Let's Encrypt, publica 80/443 no host)
#
# Diferenças vs staging:
#   - Portas 80/443 (vs 8080/8443)
#   - DB = chilli (vs chilli_staging)
#   - NODE_ENV=production
#   - JWT_SECRET diferente
#   - nginx.prod.conf (rota por SNI: chilliplay.com.br → prod, stg.* → staging)
#   - Cert de /etc/letsencrypt/live/chilliplay/ (emitido por infra/issue-letsencrypt.sh)
#
# Deploy:
#   scripts/deploy.sh prod
# ============================================================================

name: chilli-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chilli-backend-prod
    restart: unless-stopped
    # O Dockerfile já roda como `node` (uid 1000). O entrypoint
    # (docker-entrypoint.sh) ajusta o owner de /uploads no boot.
    env_file:
      - ./backend/.env.prod
    volumes:
      - chilli_uploads_prod:/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - chilli_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chilli-frontend-prod
    restart: unless-stopped
    networks:
      - chilli_prod_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: chilli-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Cert do Let's Encrypt (lido pelo nginx, gerenciado pelo certbot no host).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot para o desafio HTTP-01 do certbot. O nginx serve
      # /.well-known/acme-challenge/ daqui; o certbot escreve os tokens
      # durante `renew`.
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
      # Volumes de upload dos DO backends. Cada server block aponta
      # para o path certo (alias /uploads-prod/ ou /uploads-stg/) —
      # a URL pública /uploads/... é a mesma, mas o conteúdo diverge
      # por ambiente.
      - chilli_uploads_prod:/uploads-prod:ro
      - chilli_uploads_staging:/uploads-stg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 && nc -z 127.0.0.1 80 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Ingressa nas duas redes para rotear chilliplay.com.br → prod
    # e stg.chilliplay.com.br → staging. Os upstreams no nginx usam os
    # container names únicos (chilli-backend-prod, chilli-backend-staging)
    # para evitar ambiguidade de DNS.
    networks:
      - chilli_prod_net
      - chilli_staging_net
    networks:
      - chilli_prod_net
      - chilli_staging_net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  chilli_uploads_prod:
  # Declarado aqui (mesmo sem service local) para que o `docker compose up`
  # saiba que o bind-mount da prod nginx em /uploads-stg aponta para um
  # volume gerenciado pelo projeto chilli-staging.
  chilli_uploads_staging:
    external: true
    name: chilli-staging_chilli_uploads_staging

networks:
  chilli_prod_net:
    external: true
    name: chilli_prod_net
  chilli_staging_net:
    external: true
    name: chilli_staging_net
