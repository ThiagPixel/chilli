# ============================================================================
# Chilli — Nginx (produção, multi-domínio).
#
# Domínios:
#   - chilliplay.com.br       → prod  (chilli_prod_net)
#   - stg.chilliplay.com.br   → staging (chilli_staging_net, cross-network)
#
# Portas:
#   - 80   → ACME challenge (certbot webroot) + 308 → 443
#   - 443  → TLS único (cobre os dois domínios no mesmo cert)
#
# Upstreams resolvidos pelos container names únicos
# (chilli-backend-prod, chilli-frontend-prod, etc.) para evitar
# ambiguidade de DNS quando o nginx ingressa em duas redes.
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/font-woff2;
  gzip_min_length 1024;

  # Upstreams — nomes únicos evitam ambiguidade entre redes.
  upstream prod_backend {
    server chilli-backend-prod:3000;
  }
  upstream prod_frontend {
    server chilli-frontend-prod:80;
  }
  upstream stg_backend {
    server chilli-backend-staging:3000;
  }
  upstream stg_frontend {
    server chilli-frontend-staging:80;
  }

  # Caminho do cert (symlink mantido pelo certbot renew).
  ssl_certificate     /etc/letsencrypt/live/chilliplay.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chilliplay.com.br/privkey.pem;

  # === HTTP :80 — ACME challenge + redirect ===
  server {
    listen 80 default_server;
    server_name chilliplay.com.br stg.chilliplay.com.br;

    # Webroot do certbot: serves /.well-known/acme-challenge/.
    # Necessário porque o certbot renova via HTTP-01 (porta 80).
    location /.well-known/acme-challenge/ {
      root /var/www/letsencrypt;
    }

    # Tudo o mais → HTTPS.
    location / {
      return 308 https://$host$request_uri;
    }
  }

  # === HTTPS :443 — chilliplay.com.br (prod) ===
  server {
    listen 443 ssl;
    http2 on;
    server_name chilliplay.com.br;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Health do próprio nginx.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Health do backend via proxy.
    location = /api/health {
      proxy_pass         http://prod_backend/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # API.
    location /api/ {
      proxy_pass         http://prod_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (long-lived, upgrade).
    location /socket.io/ {
      proxy_pass             http://prod_backend;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_set_header       Upgrade           $http_upgrade;
      proxy_set_header       Connection        "upgrade";
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
      proxy_read_timeout     86400s;
    }

    # Uploads de mapa — volume do backend prod.
    # (Compose monta `chilli_uploads_prod` em /uploads-prod e
    # `chilli_uploads_staging` em /uploads-stg, ambos read-only.)
    location /uploads/ {
      alias /uploads-prod/;
      expires 7d;
      add_header Cache-Control "public";
    }

    # Frontend.
    location / {
      proxy_pass         http://prod_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # === HTTPS :443 — stg.chilliplay.com.br (staging, cross-network) ===
  server {
    listen 443 ssl;
    http2 on;
    server_name stg.chilliplay.com.br;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location = /api/health {
      proxy_pass         http://stg_backend/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    location /api/ {
      proxy_pass         http://stg_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass             http://stg_backend;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_set_header       Upgrade           $http_upgrade;
      proxy_set_header       Connection        "upgrade";
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
      proxy_read_timeout     86400s;
    }

    # Uploads de mapa — volume do backend staging.
    location /uploads/ {
      alias /uploads-stg/;
      expires 7d;
      add_header Cache-Control "public";
    }

    location / {
      proxy_pass         http://stg_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
