# ============================================================================
# Chilli — Nginx (produção).
#
# Idêntico ao staging, mas portas 80/443.
# Para um dia colocar domínio + Let's Encrypt, basta substituir o
# bloco `ssl_certificate` por paths do certbot e ajustar `server_name`.
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/font-woff2;
  gzip_min_length 1024;

  upstream chilli_backend {
    server backend:3000;
  }

  upstream chilli_frontend {
    server frontend:80;
  }

  # HTTP → HTTPS redirect.
  server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
  }

  # HTTPS principal.
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HSTS (1 ano). Só faz sentido com cert confiável; com self-signed
    # o browser ignora. Mantido para quando trocar o cert.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # Health do próprio nginx.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Health do backend via proxy.
    location = /api/health {
      proxy_pass         http://chilli_backend/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # API.
    location /api/ {
      proxy_pass         http://chilli_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (long-lived, upgrade). proxy_buffering off = sem buffer.
    location /socket.io/ {
      proxy_pass             http://chilli_backend;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_set_header       Upgrade           $http_upgrade;
      proxy_set_header       Connection        "upgrade";
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
      proxy_read_timeout     86400s;
    }

    # Uploads de mapa.
    location /uploads/ {
      alias /uploads/;
      expires 7d;
      add_header Cache-Control "public";
    }

    # Frontend.
    location / {
      proxy_pass         http://chilli_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
