# ============================================================================
# Chilli — Nginx (produção).
#
# TLS + reverse proxy. Termina 80/443 e encaminha:
#   - /api/*       → backend:3000
#   - /socket.io/* → backend:3000
#   - /uploads/*   → volume local (uploads de mapa)
#   - /            → frontend (Nginx servindo o build)
#
# Este arquivo é montado em /etc/nginx/nginx.conf dentro do container
# de produção (ver ARCHITECTURE.md §8.4).
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 12m; # um pouco acima do limite do backend (10MB)

  # Logs estruturados mínimos — produção pluga um coletor.
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/font-woff2;
  gzip_min_length 1024;

  # Upstreams
  upstream chilli_backend {
    server backend:3000;
  }

  server {
    listen 80;
    server_name _;

    # Health check do próprio nginx (sempre 200 se o processo estiver vivo).
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Health check do backend via proxy. 200/503 (degraded) = container healthy.
    location = /api/health {
      proxy_pass         http://chilli_backend/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # API.
    location /api/ {
      proxy_pass         http://chilli_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (long-lived, upgrade). proxy_buffering off = sem buffer de eventos.
    location /socket.io/ {
      proxy_pass             http://chilli_backend;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_set_header       Upgrade           $http_upgrade;
      proxy_set_header       Connection        "upgrade";
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
      proxy_read_timeout     86400s;
    }

    # Uploads de mapa (volume compartilhado).
    location /uploads/ {
      alias /uploads/;
      expires 7d;
      add_header Cache-Control "public";
    }

    # Frontend (build estático).
    location / {
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets com hash.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }
  }
}
