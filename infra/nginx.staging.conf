# ============================================================================
# Chilli — Nginx (staging).
#
# TLS self-signed + reverse proxy.
# - 8443 (HTTPS) → atende
# - 8080 (HTTP)  → 308 redirect para 8443
#
# Upstreams:
#   - backend:3000  (chilli-backend-staging)
#   - frontend:80   (chilli-frontend-staging)
#
# Self-signed: browser vai avisar. Aceitável para staging sem domínio.
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/font-woff2;
  gzip_min_length 1024;

  # Upstreams (resolvidos via DNS da rede chilli_staging_net).
  upstream chilli_backend {
    server backend:3000;
  }

  upstream chilli_frontend {
    server frontend:80;
  }

  # HTTP → HTTPS redirect.
  server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
  }

  # HTTPS principal.
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (complementa helmet no backend).
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Health do próprio nginx.
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Health do backend via proxy.
    location = /api/health {
      proxy_pass         http://chilli_backend/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # API.
    location /api/ {
      proxy_pass         http://chilli_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO (long-lived, upgrade). proxy_buffering off = sem buffer.
    location /socket.io/ {
      proxy_pass             http://chilli_backend;
      proxy_http_version     1.1;
      proxy_buffering        off;
      proxy_set_header       Upgrade           $http_upgrade;
      proxy_set_header       Connection        "upgrade";
      proxy_set_header       Host              $host;
      proxy_set_header       X-Real-IP         $remote_addr;
      proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto $scheme;
      proxy_read_timeout     86400s;
    }

    # Uploads de mapa (volume compartilhado entre backend e nginx).
    location /uploads/ {
      alias /uploads/;
      expires 7d;
      add_header Cache-Control "public";
    }

    # Frontend (build estático via container frontend).
    location / {
      proxy_pass         http://chilli_frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
