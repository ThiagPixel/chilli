name: Deploy prod

on:
  # Push direto na branch main (ex.: merge de PR via botão).
  push:
    branches: [main]
  # Trigger manual via aba Actions (útil pra reprocessar sem push novo).
  workflow_dispatch:
  # Roda SÓ quando o CI passou — gate de qualidade. Requer o nome do
  # workflow (CI) e o nome da branch do push original.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  # Em prod, NUNCA cancela uma run em progresso — espera terminar.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy para produção
    # Só prossegue se:
    #   - push direto, OU
    #   - workflow_dispatch manual, OU
    #   - workflow_run do CI terminou com success.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production   # exige aprovação manual configurada no GitHub

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/chilli/app
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            ./scripts/deploy.sh prod

      - name: Notificar Slack em falha
        if: failure()
        run: |
          curl -fsS -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ deploy prod falhou (`'"$GITHUB_RUN_ID"'`). Veja: '"$GITHUB_SERVER_URL"'/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"'"}' \
            || echo "AVISO: falha ao notificar Slack (secrets ausente?)"
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}